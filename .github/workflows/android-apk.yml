name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.19.4'
          package-manager-cache: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Generate Android project
        env:
          CI: '1'
        run: npx expo prebuild --clean --platform android

      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ECUMaster-BLE-RX-Stats.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: ECUMaster-BLE-RX-Stats-APK
          path: ECUMaster-BLE-RX-Stats.apk
          if-no-files-found: error
          retention-days: 14
